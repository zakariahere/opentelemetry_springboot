services:

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.123.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otelcol-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP  <- Spring Boot app sends here
    depends_on:
      - tempo
      - mimir
      - loki

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./config/tempo-config.yaml:/etc/tempo/config.yaml:ro
    ports:
      - "3200:3200"   # Tempo HTTP query API

  mimir:
    image: grafana/mimir:2.15.0
    command: ["--config.file=/etc/mimir/config.yaml"]
    volumes:
      - ./config/mimir-config.yaml:/etc/mimir/config.yaml:ro
    ports:
      - "9009:9009"   # Mimir HTTP (OTLP push + Prometheus query API)

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./config/loki-config.yaml:/etc/loki/config.yaml:ro
    ports:
      - "3100:3100"   # Loki HTTP

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"   # Grafana UI
    depends_on:
      - tempo
      - mimir
      - loki

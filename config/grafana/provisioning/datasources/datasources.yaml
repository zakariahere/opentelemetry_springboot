apiVersion: 1

datasources:

  # Mimir (metrics - Prometheus-compatible query API)
  - name: Mimir
    uid: mimir
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  # Tempo (traces)
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        tags:
          - key: service.name
            value: service_name
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: mimir
        tags:
          - key: service.name
            value: job
        queries:
          - name: "Request rate"
            query: "rate(http_server_requests_seconds_count{$$__tags}[5m])"
      serviceMap:
        datasourceUid: mimir
      nodeGraph:
        enabled: true
      search:
        hide: false

  # Loki (logs)
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    jsonData:
      derivedFields:
        - matcherRegex: 'traceId=([a-f0-9]+)'
          name: TraceID
          url: "${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: "View Trace in Tempo"
